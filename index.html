<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón Interactivo - Claro/Oscuro</title>
  <style>
    /* VARIABLES DE COLOR (MODO OSCURO POR DEFECTO) */
    :root {
      --bg-gradient-1: #0f172a;
      --bg-gradient-2: #1e1b4b;
      --bg-gradient-3: #311042;
      --card-bg: rgba(30, 41, 59, 0.85);
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --toggle-bg: #334155;
    }

    /* TEMA CLARO */
    [data-theme="light"] {
      --bg-gradient-1: #e0f2fe;
      --bg-gradient-2: #e0e7ff;
      --bg-gradient-3: #f3e8ff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
      --toggle-bg: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

    /* ANIMACIÓN DEL FONDO (Gradient Movement) */
    body {
      background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* TARJETA DE CRISTAL (Glassmorphism) */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    /* BOTÓN MODO CLARO / OSCURO */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--toggle-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    h2 {
      margin-top: 10px;
      color: var(--text-main);
      text-align: center;
      font-size: 24px;
    }

    p {
      color: var(--text-muted);
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 13px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background-color: var(--input-bg);
      color: var(--text-main);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Botón para alternar modo claro / oscuro -->
    <button class="theme-toggle" id="themeBtn">🌙 Modo Oscuro</button>

    <h2>Buzón de Opinión</h2>
    <p>Prueba el cambio de tema arriba y envíame un mensaje.</p>

    <!-- Formulario vinculado a Formspree -->
    <form action="https://formspree.io/f/mzedydya" method="POST">
      
      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Alexander" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="email">Tu correo electrónico:</label>
        <input type="email" id="email" name="_replyto" placeholder="nombre@correo.com" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="comentario">Comentario o mensaje:</label>
        <textarea id="comentario" name="comentario" rows="4" placeholder="Escribe aquí tu opinión..." required></textarea>
      </div>

      <button type="submit">Enviar comentario 📩</button>

    </form>
  </div>

  <!-- JavaScript para cambiar el tema -->
  <script>
    const themeBtn = document.getElementById('themeBtn');
    let isDark = true;

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeBtn.innerHTML = '🌙 Modo Oscuro';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeBtn.innerHTML = '☀️ Modo Claro';
      }
    });
  </script>

</body>
</html>
